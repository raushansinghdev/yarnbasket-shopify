# Publishes coming-soon/ to GitHub Pages (yarnbasket.in) whenever it changes on main.
# Remove this workflow and the coming-soon/ folder once the domain points to Shopify.
name: Deploy coming-soon page

on:
  push:
    branches: [main]
    paths:
      - "coming-soon/**"
      - ".github/workflows/coming-soon.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coming-soon
      - id: deployment
        uses: actions/deploy-pages@v4
